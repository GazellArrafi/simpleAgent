<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>simpleAgent</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><path d='M8 13l8-5 8 5v1H8zM10 15h2v7h-2zM15 15h2v7h-2zM20 15h2v7h-2zM8 23h16v2H8z' fill='white'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <aside class="nav" id="nav">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-6 9 6v1H3zM5 11h2.5v7H5zM10.75 11h2.5v7h-2.5zM16.5 11H19v7h-2.5zM3 19h18v2H3z"/></svg>
      </div>
      <div>
        <div class="brand-name">simpleAgent</div>
        <div class="brand-sub">Personalisasi nasabah</div>
      </div>
    </div>

    <nav class="nav-links">
      <a href="#/nasabah" data-page="nasabah">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>Nasabah</a>
      <a href="#/outbox" data-page="outbox">
        <svg viewBox="0 0 24 24"><path d="M4 4h16v12H4z"/><path d="M4 16l4 4h8l4-4M9 9l3 3 3-3M12 4v8"/></svg>Outbox</a>
      <a href="#/autopilot" data-page="autopilot">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8l6 4-6 4z"/></svg>Autopilot</a>
      <a href="#/pengaturan" data-page="pengaturan">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Pengaturan</a>
    </nav>

    <div class="nav-status" id="nav-status">
      <div class="skeleton" style="height:64px"></div>
    </div>

    <button class="theme-toggle" id="theme-toggle" type="button" title="Ganti tema">
      <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <span>Tema</span>
    </button>
  </aside>

  <main class="main" id="main">
    <div class="page-loading"><div class="spinner"></div></div>
  </main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<dialog class="dialog" id="confirm">
  <form method="dialog">
    <h3 id="confirm-title">Yakin?</h3>
    <p id="confirm-body"></p>
    <div class="dialog-actions">
      <button class="btn" value="cancel">Batal</button>
      <button class="btn btn-danger" value="ok" id="confirm-ok">Ya, lanjut</button>
    </div>
  </form>
</dialog>

<script src="/app.js"></script>
</body>
</html>
